name: test

on:
  push:
    branches:
      - main
      - '**-ci'
      - '**-cig'
  pull_request:
    branches:
      - main

# Limit permissions on the repository
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Native libraries linked by the workspace crates: libpq (pgbr-db),
      # libssh2 (pgbr-storage sftp), and the zlib/bz2/lz4/zstd family
      # (pgbr-compress codecs).
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential \
            libpq-dev libssh2-1-dev \
            liblz4-dev libbz2-dev zlib1g-dev libzstd-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup default 1.95.0
          cargo --version && rustc --version

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
