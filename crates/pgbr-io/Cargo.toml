[package]
name = "pgbr-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]

[dependencies]
# Errors raised during I/O share the typed `Error`/`ErrorType` infrastructure so callers
# see a single error story.
pgbr-error = { path = "../pgbr-error" }
sha1 = "0.10"
sha2 = "0.10"
# Cipher filter — AES-256-CBC with OpenSSL "Salted__" framing. RustCrypto stack:
# `aes` block cipher, `cbc` mode (with block-padding for PKCS#7), `md-5` for the
# legacy EVP_BytesToKey KDF, and `rand` for the per-encryption salt.
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding"] }
md-5 = "0.10"
rand = "0.8"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
