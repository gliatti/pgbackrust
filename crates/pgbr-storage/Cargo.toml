[package]
name = "pgbr-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]

[dependencies]
pgbr-error = { path = "../pgbr-error" }
pgbr-io = { path = "../pgbr-io" }
pgbr-protocol = { path = "../pgbr-protocol" }
ureq = "2"
rustls = "0.23"
rustls-pemfile = "2"
