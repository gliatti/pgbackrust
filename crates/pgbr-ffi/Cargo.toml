[package]
name = "pgbr-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "pgbr_ffi"
crate-type = ["staticlib", "rlib"]

[features]
# Enable when the C side compiles with `#define DEBUG` (test.pl harness, meson `--buildtype=debug`).
# Affects layout-sensitive struct mirrors in pgbr-core::mem_context. The default `meson setup
# build` runs `buildtype=release` and does NOT define DEBUG, so the feature stays off.
c-debug = ["pgbr-core/c-debug"]

[dependencies]
pgbr-core = { path = "../pgbr-core" }
pgbr-error = { path = "../pgbr-error" }
pgbr-encode = { path = "../pgbr-encode" }
pgbr-postgres = { path = "../pgbr-postgres" }
pgbr-crypto = { path = "../pgbr-crypto" }
pgbr-regex = { path = "../pgbr-regex" }
pgbr-compress = { path = "../pgbr-compress" }

[lints]
workspace = true
