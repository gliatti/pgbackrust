[package]
name = "pgbr-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]

[dependencies]
# Source-of-truth parser for `src/build/config/config.yaml`. `pgbr-config` consumes its
# typed Config and lowers it into the runtime configuration model used at the start of
# each pgBackRest invocation.
pgbr-build = { path = "../pgbr-build" }
# Errors raised during config compilation/resolution share the typed `Error`/`ErrorType`
# infrastructure so callers see a single error story.
pgbr-error = { path = "../pgbr-error" }
# `serde_yml::Value` appears in resolved option fields where the schema is type-
# dependent (`default:`, `allow-list:`, `allow-range:`, `depend.list`, …). Same version as
# pgbr-build's transitively-pulled copy.
serde_yml = "0.0.12"

[lints]
workspace = true
