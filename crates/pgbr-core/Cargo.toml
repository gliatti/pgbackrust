[package]
name = "pgbr-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]

[features]
# Enable when the C side compiles with `#define DEBUG`. Adds the DEBUG-only `name`,
# `sequence_new`, and `active` fields to the `MemContext` mirror so the Rust struct stays
# byte-identical with the C bitfield layout.
c-debug = []

[dependencies]
# `log::format` reuses the printf-style formatter and typed `Arg` variants from
# `pgbr-error::format` so logInternalFmt's args-blob round-trip mirrors the
# error-side path established in Phase 27 sub-issue B. Also needed for the typed
# `Error` value returned by `log::format::log_internal*` on `write(2)` failure.
pgbr-error = { path = "../pgbr-error" }

[lints]
workspace = true
