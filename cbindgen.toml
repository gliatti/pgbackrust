# Configuration consumed by `cbindgen` to emit pgbr_ffi.h from crates/pgbr-ffi.
# Regenerated by meson on every build via build-ffi.sh.

language = "C"
style = "type"
include_guard = "PGBR_FFI_H"
header = """\
/* SPDX-License-Identifier: MIT
 * Auto-generated by cbindgen during the C->Rust migration. Do not edit by hand —
 * change crates/pgbr-ffi/src/lib.rs and rerun the meson build.
 */"""
no_includes = false
sys_includes = ["stddef.h", "stdint.h"]
documentation = true
documentation_style = "c"

[parse]
parse_deps = false

[export]
prefix = "PGBR_"
