services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: pgbackrust-dev:latest
    working_dir: /work/pgbackrust
    volumes:
      - .:/work/pgbackrust
      - cargo-registry:/cargo/registry
      - cargo-git:/cargo/git
      - rust-target:/work/target
    environment:
      CARGO_HOME: /cargo
      RUSTUP_HOME: /rustup
    command: ["sleep", "infinity"]

  cargo:
    image: pgbackrust-dev:latest
    working_dir: /work/pgbackrust
    volumes:
      - .:/work/pgbackrust
      - cargo-registry:/cargo/registry
      - cargo-git:/cargo/git
      - rust-target:/work/target
    environment:
      CARGO_HOME: /cargo
      RUSTUP_HOME: /rustup
    entrypoint: ["cargo"]

  meson:
    image: pgbackrust-dev:latest
    working_dir: /work/pgbackrust
    volumes:
      - .:/work/pgbackrust
    entrypoint: ["meson"]

  test-pl:
    image: pgbackrust-dev:latest
    working_dir: /work
    volumes:
      - .:/work/pgbackrust
      - cargo-registry:/cargo/registry
      - cargo-git:/cargo/git
      - rust-target:/work/target
    environment:
      CARGO_HOME: /cargo
      RUSTUP_HOME: /rustup
    entrypoint: ["pgbackrust/test/test.pl"]

volumes:
  cargo-registry:
  cargo-git:
  rust-target:
